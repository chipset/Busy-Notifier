name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Swift tests
        run: swift test
      - name: Browser extension tests
        run: node --test BrowserExtension/tests/*.test.cjs
      - name: USB light firmware logic
        run: python3 -m unittest discover -s Firmware/UsbLight/tests
